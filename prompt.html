<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiden's Prompt Library</title>
    <style>
        /* 웹사이트 전체 디자인 규칙 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.6; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .prompt-card { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        .prompt-text { background: #f8f9fa; padding: 15px; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 14px; margin-bottom: 10px; }
        button { cursor: pointer; padding: 8px 16px; border: none; border-radius: 4px; background: #007bff; color: white; font-weight: bold; }
        button:hover { background: #0056b3; }
        .admin-btn { background: #dc3545; }
        .admin-btn:hover { background: #c82333; }
    </style>
</head>
<body>

    <div class="header">
        <h1>AI 프롬프트 공유소</h1>
        <!-- 깃허브 레포지토리 주소를 생성한 후 아래 URL을 교체해야 해 -->
        <button class="admin-btn" onclick="window.open('https://github.com/내아이디/내레포지토리/edit/main/index.html', '_blank')">관리자 모드</button>
    </div>

    <!-- 첫 번째 프롬프트 세트 시작 -->
    <div class="prompt-card">
        <h2>[비디오] 카페 씬 시네마틱 앵글</h2>
        <p>카메라 앵글과 조명, 텍스트 레이아웃을 세부적으로 통제하는 프롬프트야.</p>
        
        <!-- id="prompt1" 부분은 프롬프트마다 고유해야 해 -->
        <div class="prompt-text" id="prompt1">Scene: Cozy cafe interior, golden hour lighting.
Camera: 35mm lens, shallow depth of field, slow pan.
Style: Cinematic, highly detailed.
Text-Graphic Layout: Lower third minimal sans-serif text.</div>
        
        <!-- onclick 안의 아이디가 위의 텍스트 영역 id와 일치해야 복사됨 -->
        <button onclick="copyText('prompt1')">복사하기</button>
    </div>
    <!-- 첫 번째 프롬프트 세트 끝 -->

    <script>
        // 클립보드 복사 기능 구현
        function copyText(elementId) {
            const textToCopy = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("프롬프트가 클립보드에 복사되었어!");
            }).catch(err => {
                alert("복사 실패: " + err);
            });
        }
    </script>
</body>
</html>
